buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.4'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

android {
    compileSdkVersion 29
    buildToolsVersion "30.0.3"
    ndkVersion "25.1.8937393"

    defaultConfig {
        applicationId "net.beyondreality.openxr_provider.finger_painting3"
        // for Vulkan, need at least 24
        minSdkVersion 26

        versionName = "1.0"
        versionCode = 1

        externalNativeBuild {
            ndk {
                abiFilters 'arm64-v8a'
            }
            cmake {
                cppFlags ''
				arguments "-DCMAKE_BUILD_TYPE=Debug"
            }
        }
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            res.srcDir 'android_resources'
            assets.srcDirs =['assets']
        }
        Vulkan {
            res.srcDir 'android_resources/vulkan'
            assets.srcDirs =['android_assets']
        }
    }
	
    signingConfigs {
        release {
            storeFile file("my-release-key.jks")
            storePassword "testtest"
            keyAlias "my-key-alias"
            keyPassword "testtest"
        }
    }
	
    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            packagingOptions {
                doNotStrip '**/*.so'
            }
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
			ndk {
				debuggable true
				debugSymbolLevel 'FULL'
			}
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            jniDebuggable false
			minifyEnabled false
			shrinkResources false
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
			ndk {
				debuggable false
			}
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
            version "3.22.1"
        }
    }

    flavorDimensions 'api'

    productFlavors {
        Vulkan {
            dimension 'api'
            applicationIdSuffix '.openxr'
            externalNativeBuild.cmake.cppFlags '-DDEFAULT_GRAPHICS_PLUGIN_VULKAN'

            resValue "string", "app_name", "OpenXR Provider Sample 08 - Finger Painting 3"
        }
    }
}

dependencies {
    implementation project(':VkLayer_gfxreconstruct')
}
